name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install project (core + learner_model deps only, no agent/LLM)
        run: uv sync --extra dev

      - name: Lint (ruff)
        run: uv run ruff check backend

      - name: Format check (black)
        run: uv run black --check backend

      # CLAUDE.md section 14: core + learner_model (no external services). The
      # API tests run against in-memory SQLite, so they need no live Postgres.
      - name: Test
        run: uv run pytest
