<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0b0d11" media="(prefers-color-scheme: dark)" />
  <meta name="description" content="learn-german — an adaptive spaced-repetition vocabulary trainer." />
  <title>learn-german</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="app.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Ctext x='16' y='23' font-size='15' font-family='system-ui,sans-serif' font-weight='700' fill='white' text-anchor='middle'%3ELG%3C/text%3E%3C/svg%3E" />

  <style>
    /* first-paint boot state — before app.js swaps the body */
    .boot { min-height:100dvh; display:grid; place-items:center; gap:14px; }
    .boot .logo {
      width:44px; height:44px; border-radius:13px; display:grid; place-items:center;
      color:#fff; font:700 16px/1 system-ui,sans-serif; letter-spacing:.02em;
      background:linear-gradient(145deg,#5b5bd6,#4338ca);
      animation:boot-pulse 1.4s ease-in-out infinite;
    }
    @keyframes boot-pulse { 0%,100% { opacity:.55; transform:scale(.96); } 50% { opacity:1; transform:scale(1); } }
    .boot p { color:#8a91a0; font:500 13px/1 system-ui,sans-serif; }
    @media (prefers-reduced-motion: reduce) { .boot .logo { animation:none; } }
  </style>
</head>
<body>
  <div class="boot">
    <div class="logo">LG</div>
    <p>learn-german</p>
  </div>
  <noscript><p style="text-align:center;font:14px system-ui;padding:2rem">This app needs JavaScript enabled.</p></noscript>
  <script src="app.js"></script>
</body>
</html>
